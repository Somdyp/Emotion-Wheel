<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion wheel — pick a target for the ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#16202b;
    --panel:#1d2937;
    --raise:#243343;
    --rule:#2f4055;
    --ink:#eef3f8;
    --muted:#93a6ba;
    --accent:#f2b441;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Inter Tight",system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:38px 24px 64px}

  header{margin-bottom:30px;max-width:56ch}
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(30px,5vw,44px);
    line-height:1.02;
    letter-spacing:-.025em;
    margin:0 0 10px;
  }
  header p{margin:0;color:var(--muted);font-size:15.5px}

  .stage{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:40px;align-items:start}
  @media(max-width:860px){.stage{grid-template-columns:1fr;gap:28px}}

  .wheelcol{position:sticky;top:28px}
  @media(max-width:860px){.wheelcol{position:static}}
  svg{width:100%;max-width:470px;display:block;margin:0 auto;overflow:visible}

  .seg{cursor:pointer;stroke:var(--ground);stroke-width:1.25;transition:opacity .25s ease}
  .seg:hover{filter:brightness(1.14)}
  .seg:focus-visible{outline:none;stroke:#fff;stroke-width:2.5}
  .dim{opacity:.26}
  .lit{stroke:#fff;stroke-width:2.5}
  .lbl{fill:#14202c;font-family:"Inter Tight",sans-serif;font-weight:600;pointer-events:none;letter-spacing:.005em}
  #needle{transform-box:view-box;transform-origin:200px 200px;transition:transform 3.6s cubic-bezier(.17,.92,.24,1)}
  .hubtxt{fill:var(--muted);font-family:"Inter Tight",sans-serif;font-size:8.5px;text-anchor:middle}

  .controls{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:14px;font-weight:500;
    border-radius:999px;padding:10px 20px;cursor:pointer;
    border:1px solid var(--rule);background:var(--raise);color:var(--ink);
    transition:background .18s ease,border-color .18s ease;
  }
  button:hover{background:#2c3d50;border-color:#41576f}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
  .primary:hover{background:#ffc85c;border-color:#ffc85c}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 26px 24px;min-height:420px}
  .empty{color:var(--muted)}
  .empty h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;color:var(--ink);margin:0 0 10px}
  .empty ol{margin:0;padding-left:18px}
  .empty li{margin-bottom:7px}

  .lineage{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13.5px;margin-bottom:6px}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(28px,4.4vw,38px);line-height:1.05;letter-spacing:-.02em;margin:0 0 4px}
  .sounds{font-size:17px;color:var(--ink);margin:0 0 22px;font-style:italic;opacity:.9}

  .block{border-top:1px solid var(--rule);padding-top:15px;margin-top:15px}
  .block h3{font-family:"Inter Tight",sans-serif;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 7px}
  .block p{margin:0;max-width:52ch}
  ul.hooks{list-style:none;margin:0;padding:0}
  ul.hooks li{padding:8px 0 8px 16px;border-left:2px solid var(--rule);margin-bottom:7px;max-width:52ch}
  ul.hooks li:last-child{margin-bottom:0}

  .foot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .status{font-size:13px;color:var(--muted);min-height:18px;margin-top:10px;text-align:center}
  @media(prefers-reduced-motion:reduce){#needle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>What should this ad make them feel?</h1>
    <p>Click any emotion to get the job it does in an ad, the angle it wants, and hooks to start from. Or spin it and let the wheel pick your constraint.</p>
  </header>

  <div class="stage">
    <div class="wheelcol">
      <svg id="wheel" viewBox="0 0 400 400" role="group" aria-label="Emotion wheel"></svg>
      <div class="controls">
        <button class="primary" id="spin">Spin the wheel</button>
        <button id="clear">Clear</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
const DATA = [
  { name:"Joy", color:"#f2b441",
    job:"Sells the after. You show the life the product makes possible, then let the price be the small cost of admission.",
    angle:"Lead with the outcome moment instead of the problem. Fastest version: a testimonial filmed at peak relief, before any explanation.",
    shades:[
      { name:"Serenity", sounds:"Finally, nothing left to manage.", hooks:["I stopped thinking about it entirely.","It's the most boring part of my day now, and that's the point."] },
      { name:"Delight", sounds:"That worked better than it had any right to.", hooks:["I was not expecting this to do anything.","Three days in and I texted my sister about it."] },
      { name:"Ecstasy", sounds:"Full conversion, said out loud.", hooks:["I've told everyone who will sit still long enough.","This ruined every other one I'd tried."] }
    ]},
  { name:"Trust", color:"#6fae7c",
    job:"Lowers perceived risk. Trust doesn't sell the outcome — it sells believing you about the outcome.",
    angle:"Put proof in front of promise: founder on camera, sourcing, a third-party test, the refund terms said plainly.",
    shades:[
      { name:"Acceptance", sounds:"Fine, I'll hear you out.", hooks:["You've probably already tried three of these.","Here's what we're not going to claim."] },
      { name:"Admiration", sounds:"These people clearly know what they're doing.", hooks:["We spent fourteen months on one ingredient.","Our formulator spent a decade doing this for someone else."] },
      { name:"Devotion", sounds:"This is my brand now.", hooks:["Sixth bottle. Same routine.","I don't shop this category anymore. I just reorder."] }
    ]},
  { name:"Fear", color:"#3f9a93",
    job:"Creates urgency by making the cost of doing nothing visible and near.",
    angle:"Name one specific consequence with a timeline — vague dread doesn't convert, dated dread does. Then hand them the exit immediately.",
    shades:[
      { name:"Apprehension", sounds:"Something's slightly off and I've noticed.", hooks:["If you're flat by 3pm, this is usually why.","It starts small enough to keep ignoring."] },
      { name:"Anxiety", sounds:"This is going to get worse if I leave it.", hooks:["The part nobody warns you about is what comes next.","By the time you notice it, it's been going on for months."] },
      { name:"Terror", sounds:"Act now or lose something real.", hooks:["I ignored this for two years and paid for it.","Here's what waiting actually costs."] }
    ]},
  { name:"Surprise", color:"#5a8fd0",
    job:"Buys attention in the first second. It sells nothing on its own — it stops the scroll and hands the next line an audience.",
    angle:"Break a category expectation visually or verbally, then convert that attention into a claim within two seconds or you lose it.",
    shades:[
      { name:"Distraction", sounds:"Wait — what is that?", hooks:["Don't scroll, I need eight seconds.","This is not what it looks like."] },
      { name:"Amazement", sounds:"That's not how I thought it worked.", hooks:["You've been doing this backwards the whole time.","Watch what happens at four seconds."] },
      { name:"Astonishment", sounds:"That can't be right.", hooks:["This cost twelve dollars and replaced a four hundred dollar one.","I filmed it because nobody believed me."] }
    ]},
  { name:"Sadness", color:"#6a6dc0",
    job:"Builds identification. The viewer sees their own situation named honestly and stays to watch it resolve.",
    angle:"Open in the low moment before the fix, in specific physical detail. Earn the turn — cutting to the product too early kills it.",
    shades:[
      { name:"Pensiveness", sounds:"I've been sitting with this a while.", hooks:["I didn't realise how long I'd felt like that.","Nothing was wrong. That was the problem."] },
      { name:"Disappointment", sounds:"I expected more than this.", hooks:["This is the fourth one I've bought this year.","It worked for two weeks and then it didn't."] },
      { name:"Grief", sounds:"I lost something I wanted back.", hooks:["I stopped doing the thing I liked most.","I gave up a whole year to this."] }
    ]},
  { name:"Disgust", color:"#8f63be",
    job:"Creates rejection of an alternative. Point it at the competitor, the old way, or the ingredient — never at the viewer.",
    angle:"Show the thing they should reject in close, physical detail, then stand next to it as the clean version.",
    shades:[
      { name:"Boredom", sounds:"Same as everything else out there.", hooks:["Another gummy. I know.","This category has been asleep for ten years."] },
      { name:"Aversion", sounds:"I don't want that near me.", hooks:["Turn over the bottle you're holding and read line four.","Here's what's actually in the one you buy."] },
      { name:"Loathing", sounds:"That should not be allowed.", hooks:["They're legally allowed to call this natural.","It's legal. That's the whole problem."] }
    ]},
  { name:"Anger", color:"#d4564f",
    job:"Recruits an ally. Point at a shared villain so the viewer is on your side before you've sold anything.",
    angle:"Name the villain precisely — a practice, a markup, a lie. Then be the correction, not the complaint.",
    shades:[
      { name:"Annoyance", sounds:"Small thing, but every single day.", hooks:["It's a two-second problem you have forty times a day.","Why is this still like this?"] },
      { name:"Frustration", sounds:"I've tried and it doesn't work.", hooks:["I did everything right and nothing changed.","You're not the problem here."] },
      { name:"Rage", sounds:"Someone did this on purpose.", hooks:["They know it doesn't work. They sell it anyway.","You've been paying for water and packaging."] }
    ]},
  { name:"Anticipation", color:"#de8639",
    job:"Holds attention through the middle. It's the open loop that keeps people watching long enough to hear the mechanism.",
    angle:"Promise a specific reveal early, then delay it. Works as the spine under any other emotion rather than the whole ad.",
    shades:[
      { name:"Curiosity", sounds:"I want to know how that works.", hooks:["There's one reason this works and it isn't the ingredient on the front.","Give me thirty seconds and this will annoy you for a week."] },
      { name:"Interest", sounds:"Keep going, I'm listening.", hooks:["Three things happen when you do this. The third one matters.","Here's the part I got wrong first."] },
      { name:"Vigilance", sounds:"I'm watching for it now.", hooks:["You'll notice it around day four.","Check this next time you're standing in the aisle."] }
    ]}
];

const CX=200, CY=200;
const R_IN0=62, R_IN1=118, R_OUT1=186;
const svg=document.getElementById('wheel');
const panel=document.getElementById('panel');
const statusEl=document.getElementById('status');
const NS='http://www.w3.org/2000/svg';

const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const pt=(r,a)=>{const t=(a-90)*Math.PI/180;return[CX+r*Math.cos(t),CY+r*Math.sin(t)];};

function arc(r1,r2,a1,a2){
  const [x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
  const big=(a2-a1)>180?1:0;
  return `M${x1} ${y1}A${r2} ${r2} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${big} 0 ${x4} ${y4}Z`;
}

function label(text,mid,rIn,rOut,size){
  const left = mid>180;
  const r = left ? rOut-7 : rIn+7;
  const [x,y]=pt(r,mid);
  const rot = left ? mid+90 : mid-90;
  const t=el('text',{x,y,class:'lbl','font-size':size,'text-anchor':'start','dominant-baseline':'middle',transform:`rotate(${rot} ${x} ${y})`});
  t.textContent=text;
  return t;
}

const segs=[];   // {node, coreIdx, shadeIdx|null, mid}
const shadeAngles=[];

DATA.forEach((core,i)=>{
  const a1=i*45, a2=a1+45;
  const p=el('path',{d:arc(R_IN0,R_IN1,a1,a2),fill:core.color,class:'seg',tabindex:'0',role:'button','aria-label':core.name});
  svg.appendChild(p);
  segs.push({node:p,core:i,shade:null});
  svg.appendChild(label(core.name,(a1+a2)/2,R_IN0,R_IN1,9.4));

  core.shades.forEach((sh,j)=>{
    const b1=a1+j*15, b2=b1+15, mid=b1+7.5;
    const q=el('path',{d:arc(R_IN1,R_OUT1,b1,b2),fill:core.color,class:'seg',tabindex:'0',role:'button','aria-label':sh.name,'fill-opacity':(0.92-j*0.18).toFixed(2)});
    svg.appendChild(q);
    segs.push({node:q,core:i,shade:j});
    shadeAngles.push({core:i,shade:j,mid});
    svg.appendChild(label(sh.name,mid,R_IN1,R_OUT1,8.4));
  });
});

// hub
svg.appendChild(el('circle',{cx:CX,cy:CY,r:R_IN0-2,fill:'#1d2937',stroke:'#2f4055','stroke-width':1}));
const h1=el('text',{x:CX,y:CY-5,class:'hubtxt','font-size':'9.5','font-weight':'600',fill:'#eef3f8'});h1.textContent='32 targets';
const h2=el('text',{x:CX,y:CY+9,class:'hubtxt'});h2.textContent='pick one per ad';
svg.appendChild(h1);svg.appendChild(h2);

// needle
const needle=el('g',{id:'needle'});
needle.appendChild(el('path',{d:`M${CX} ${CY-190} l7 -12 l-14 0 Z`,fill:'#eef3f8'}));
svg.appendChild(needle);

let turns=0, spinning=false, current=null;

function render(coreIdx,shadeIdx){
  current={coreIdx,shadeIdx};
  const core=DATA[coreIdx];
  segs.forEach(s=>{
    s.node.classList.toggle('dim', s.core!==coreIdx);
    s.node.classList.toggle('lit', s.core===coreIdx && s.shade===shadeIdx);
  });

  if(shadeIdx===null){
    panel.innerHTML=`
      <div class="lineage"><span class="swatch" style="background:${core.color}"></span><span>Core emotion · 3 shades on the outer ring</span></div>
      <h2 class="name">${core.name}</h2>
      <p class="sounds">${core.shades.map(s=>s.name).join(' · ')}</p>
      <div class="block"><h3>What it does in an ad</h3><p>${core.job}</p></div>
      <div class="block"><h3>The angle it wants</h3><p>${core.angle}</p></div>
      <div class="foot"><button id="copy">Copy this brief</button></div>`;
    bindCopy(`Emotion target: ${core.name}\nJob: ${core.job}\nAngle: ${core.angle}`);
  } else {
    const sh=core.shades[shadeIdx];
    panel.innerHTML=`
      <div class="lineage"><span class="swatch" style="background:${core.color}"></span><span>A shade of ${core.name}</span></div>
      <h2 class="name">${sh.name}</h2>
      <p class="sounds">“${sh.sounds}”</p>
      <div class="block"><h3>What ${core.name.toLowerCase()} does in an ad</h3><p>${core.job}</p></div>
      <div class="block"><h3>The angle it wants</h3><p>${core.angle}</p></div>
      <div class="block"><h3>Hooks to start from</h3><ul class="hooks">${sh.hooks.map(h=>`<li>${h}</li>`).join('')}</ul></div>
      <div class="foot"><button id="copy">Copy this brief</button></div>`;
    bindCopy(`Emotion target: ${sh.name} (${core.name})\nFeels like: ${sh.sounds}\nJob: ${core.job}\nAngle: ${core.angle}\nHooks:\n- ${sh.hooks.join('\n- ')}`);
  }
}

function bindCopy(text){
  const b=document.getElementById('copy');
  b.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(text); b.textContent='Copied'; }
    catch{ b.textContent='Copy blocked — select the text instead'; }
    setTimeout(()=>b.textContent='Copy this brief',1800);
  });
}

function reset(){
  current=null;
  segs.forEach(s=>{s.node.classList.remove('dim','lit')});
  statusEl.textContent='';
  panel.innerHTML=`
    <div class="empty">
      <h2>Nothing targeted yet</h2>
      <ol>
        <li>Inner ring is the eight core emotions. Outer ring splits each into three shades, mild to intense.</li>
        <li>Click one and you'll get the job it does, the angle it wants, and hooks.</li>
        <li>Spin if you'd rather be handed a constraint than choose one.</li>
      </ol>
    </div>`;
}

segs.forEach(s=>{
  s.node.addEventListener('click',()=>{ if(!spinning) render(s.core,s.shade); });
  s.node.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&!spinning){e.preventDefault();render(s.core,s.shade);}
  });
});

const spinBtn=document.getElementById('spin');
spinBtn.addEventListener('click',()=>{
  if(spinning) return;
  const pick=shadeAngles[Math.floor(Math.random()*shadeAngles.length)];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  turns+=reduce?1:4+Math.floor(Math.random()*2);
  const target=turns*360+pick.mid;
  spinning=true; spinBtn.disabled=true;
  segs.forEach(s=>s.node.classList.remove('dim','lit'));
  statusEl.textContent='Spinning…';
  needle.style.transform=`rotate(${target}deg)`;
  const done=()=>{
    spinning=false; spinBtn.disabled=false;
    statusEl.textContent=`The wheel says: ${DATA[pick.core].shades[pick.shade].name}`;
    render(pick.core,pick.shade);
  };
  if(reduce){ setTimeout(done,120); }
  else { needle.addEventListener('transitionend',done,{once:true}); setTimeout(()=>{if(spinning)done();},4200); }
});

document.getElementById('clear').addEventListener('click',()=>{ if(!spinning) reset(); });

reset();
</script>
</body>
</html>
